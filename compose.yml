services:

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=Europe/Bucharest
    devices:
      - /dev/dri/:/dev/dri/
    volumes:
      - ${JELLYFIN_DIR}/config:/config
      - ${JELLYFIN_SERIES_DIR}:/data/series
      - ${JELLYFIN_FILMS_DIR}:/data/films
    ports:
      - ${JELLYFIN_PORT}:${JELLYFIN_PORT}
    restart: unless-stopped
