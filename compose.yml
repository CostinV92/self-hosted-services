services:

  nginx-static:
    image: flashspys/nginx-static:latest
    container_name: nginx-static
    volumes:
      - ${LANDING_PAGE_DIR}:/static
    ports:
      - 8080:80
    restart: unless-stopped

  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
    volumes:
      - ${NGINX_DIR}/data:/data
      - ${NGINX_DIR}/letsencrypt:/etc/letsencrypt
    ports:
      - '80:80'
      - '443:443'
      - '81:81' # admin page
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=Europe/Bucharest
      - WEBUI_PORT=${QBT_WEB_PORT}
      - TORRENTING_PORT=${QBT_TORRENT_PORT}
    volumes:
      - ${QBT_DIR}/config:/config
      - ${QBT_DIR}/downloads:/downloads/
      - ${QBT_DIR}/qbt_ui/:/qbt_ui # webui skins
      - ${JELLYFIN_MEDIA_DIR}:/jellyfin # jellyfin library for direct downloading
    ports:
      - ${QBT_WEB_PORT}:${QBT_WEB_PORT}
      - ${QBT_TORRENT_PORT}:${QBT_TORRENT_PORT}
      - ${QBT_TORRENT_PORT}:${QBT_TORRENT_PORT}/udp
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=Europe/Bucharest
    devices:
      - /dev/dri/:/dev/dri/
    volumes:
      - ${JELLYFIN_DIR}/config:/config
      - ${JELLYFIN_SERIES_DIR}:/data/series
      - ${JELLYFIN_FILMS_DIR}:/data/films
    ports:
      - ${JELLYFIN_PORT}:${JELLYFIN_PORT}
    restart: unless-stopped

  trilium:
    image: triliumnext/notes:latest
    container_name: trilium
    ports:
      - "8090:8080"
    volumes:
      - ${TRILIUM_DIR}:/home/node/trilium-data
    restart: unless-stopped

  # Authentik services
  postgresql:
    image: docker.io/library/postgres:16-alpine
    container_name: auth_post
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - authentik_database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_DB: ${PG_DB:-authentik}
    env_file:
      - .env

  redis:
    image: docker.io/library/redis:alpine
    container_name: auth_redis
    command: --save 60 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - authentik_redis:/data

  server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2025.4}
    container_name: auth_server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS}
    volumes:
      - ${AUTHENTIK_DIR}/media:/media
      - ${AUTHENTIK_DIR}/custom-templates:/templates
    env_file:
      - .env
    ports:
      - "${COMPOSE_PORT_HTTP:-9000}:9000"
      - "${COMPOSE_PORT_HTTPS:-9443}:9443"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2025.4}
    container_name: auth_worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS}
    # `user: root` and the docker socket volume are optional.
    # See more for the docker socket integration here:
    # https://goauthentik.io/docs/outposts/integrations/docker
    # Removing `user: root` also prevents the worker from fixing the permissions
    # on the mounted folders, so when removing this make sure the folders have the correct UID/GID
    # (1000:1000 by default)
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AUTHENTIK_DIR}/media:/media
      - ${AUTHENTIK_DIR}/certs:/certs
      - ${AUTHENTIK_DIR}/custom-templates:/templates
    env_file:
      - .env
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  authentik_database:
    driver: local
  authentik_redis:
    driver: local
